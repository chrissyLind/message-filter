apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: message-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/chrissylind/message-filter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-env
            - secretRef:
                name: aws-credentials
                optional: true
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-2
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: message-filter
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8000
      targetPort: 8000