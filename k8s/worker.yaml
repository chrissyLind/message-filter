apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: message-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: worker
          image: ghcr.io/chrissylind/message-filter:latest
          imagePullPolicy: Always
          command: ["python", "-m", "message_filter.worker"]
          envFrom:
            - secretRef:
                name: app-env
            - secretRef:
                name: aws-credentials
                optional: true
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: AWS_DEFAULT_REGION
              value: us-east-2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi