apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: message-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: message-filter:latest
          imagePullPolicy: Never
          command: ["python", "-m", "message_filter.worker"]
          envFrom:
            - secretRef:
                name: app-env
            - secretRef:
                name: aws-credentials
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: AWS_DEFAULT_REGION
              value: us-east-2