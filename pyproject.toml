[project]
name = "message-filter"
version = "0.1.0"
description = "Project to filter toxic WhatsApp messages and improve my mental health"
readme = "README.md"
authors = [
    { name = "Christine Lindauer", email = "christine.lindauer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "boto3>=1.43.108",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "twilio>=9.11.2",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
message-filter = "message_filter:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["llm: calls the real Claude API (costs money)"]
addopts = "-m 'not llm'"
